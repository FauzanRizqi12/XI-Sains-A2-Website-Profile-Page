<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XI-Sains A2 Profil Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="confetti-canvas"></canvas>
    <div id="floating-messages"></div>

    <div class="bg-gears">
      <div class="gear gear-1">⚙</div>
      <div class="gear gear-2">⚙</div>
    </div>

    <div class="circuit-bg">
      <svg width="100%" height="100%">
        <path
          class="trace"
          d="M0 100 L100 100 L100 300 L250 300 L250 150 L400 150"
        />
        <path class="trace" d="M1000 500 L850 500 L850 700 L700 700 L700 550" />
        <path class="trace" d="M300 0 L300 100 L500 100 L500 250" />
      </svg>
    </div>

    <header>
      <h2 id="page-title">XI-SAINS A2 PROFILE PAGE</h2>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="search-input"
          placeholder="[ CARI NAMA / ABSEN / MINAT... ]"
          autocomplete="off"
        />
        <button id="clear-search" onclick="clearSearch()" style="display: none">
          ✕
        </button>
      </div>
      <div id="notif-banner" class="notif-banner" style="display: none">
        <span>🔔 Aktifkan pengingat ulang tahun teman kelas?</span>
        <button onclick="requestBirthdayNotification()" class="notif-btn">
          IZINKAN
        </button>
        <button onclick="dismissNotifBanner()" class="notif-close">✕</button>
      </div>
    </header>

    <main id="student-container">
      <div class="axis x-axis"></div>
      <div class="axis y-axis"></div>
      <div id="grid-content"></div>
    </main>

    <nav id="pagination">
      <button onclick="changePage(1)" class="active">PAGE 01</button>
      <button onclick="changePage(2)">PAGE 02</button>
      <button onclick="changePage(3)">PAGE 03</button>
      <button onclick="changePage(4)">PAGE 04</button>
    </nav>

    <!-- Profile Detail Modal -->
    <div id="detail-modal" class="modal">
      <div class="modal-content" id="modal-card">
        <!-- Tombol Silang Utama (Pintar: Tutup Mode Edit jika sedang edit, atau Tutup Profile) -->
        <button
          class="modal-close-main-btn"
          onclick="handleSmartClose()"
          title="Tutup"
        >
          ✕
        </button>

        <!-- Ikon Kunci di Pojok Kanan Atas Modal untuk Edit Data -->
        <button
          class="modal-edit-key-btn"
          onclick="promptEditPin()"
          title="Edit Profil"
        >
          🔑
        </button>

        <div class="modal-body-scroll">
          <div class="modal-title-header">
            <div id="m-title"></div>
          </div>
          <div class="modal-photo-container">
            <div class="photo-placeholder">FOTO</div>
            <div class="absen-badge" id="modal-absen">00</div>
          </div>
          <div class="modal-info" id="modal-info">
            <div class="info-row">
              <span class="label">Nama:</span>
              <span class="value-text"
                ><span id="m-nama">-</span>
                <button
                  id="gift-btn"
                  class="gift-btn"
                  onclick="openGiftModal()"
                  style="display: none"
                  title="Kirim Pesan Ulang Tahun"
                >
                  🎁
                </button></span
              >
            </div>
            <div class="info-row">
              <span class="label">Umur:</span>
              <span class="value-text" id="m-umur">-</span>
            </div>
            <div class="info-row">
              <span class="label">TTL:</span>
              <span class="value-text" id="m-ttl">-</span>
            </div>
            <div class="info-row">
              <span class="label">Impian:</span>
              <span class="value-text" id="m-minat">-</span>
            </div>

            <!-- Form Edit (Tersembunyi sampai PIN benar) -->
            <div id="edit-form-box" class="edit-form-container">
              <input
                type="text"
                id="edit-nama"
                class="edit-input"
                placeholder="Nama Lengkap"
              />
              <input
                type="text"
                id="edit-title"
                class="edit-input"
                placeholder="Title (Contoh: IT Developer)"
              />
              <input
                type="text"
                id="edit-ttl"
                class="edit-input"
                placeholder="TTL (Contoh: 2 Desember 2009)"
              />
              <input
                type="text"
                id="edit-minat"
                class="edit-input"
                placeholder="Cita-cita / Impian"
              />
              <button class="edit-btn-action" onclick="savePersonalData()">
                SIMPAN PERUBAHAN
              </button>
              <button
                class="edit-btn-action"
                style="border-color: #ffd700; color: #ffd700"
                onclick="closeEditForm()"
              >
                TUTUP FORM EDIT ✕
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Gift Message Modal -->
    <div id="gift-modal" class="modal gift-modal-overlay">
      <div class="gift-modal-content">
        <div class="gift-modal-header">
          <span>💌 KIRIM PESAN ULANG TAHUN</span>
          <button class="gift-modal-close" onclick="closeGiftModal()">✕</button>
        </div>

        <div class="gift-form-group">
          <label class="gift-label" for="gift-to">Untuk:</label>
          <select id="gift-to" class="gift-select"></select>
        </div>

        <div class="gift-form-group">
          <label class="gift-label" for="gift-from"
            >Nama Kamu: <span class="required">*</span></label
          >
          <input
            type="text"
            id="gift-from"
            class="gift-input"
            placeholder="Tulis namamu di sini..."
            maxlength="40"
            autocomplete="off"
          />
        </div>

        <div class="gift-form-group">
          <label class="gift-label" for="gift-message"
            >Pesan: <span class="required">*</span></label
          >
          <textarea
            id="gift-message"
            class="gift-textarea"
            placeholder="Tulis pesan singkat... (maks. 120 karakter)"
            maxlength="120"
          ></textarea>
          <div class="gift-char-count"><span id="char-count">0</span>/120</div>
        </div>

        <div id="gift-error" class="gift-error" style="display: none"></div>

        <button class="gift-send-btn" onclick="sendBirthdayMessage()">
          KIRIM PESAN 💌
        </button>
      </div>
    </div>

    <!-- Custom PIN Verification Modal -->
    <div id="pin-modal" class="modal pin-modal-overlay">
      <div class="pin-modal-content">
        <div class="pin-modal-header">
          <span>🔑 KODE AKSES PROFIL</span>
          <button class="pin-modal-close" onclick="closePinModal()">✕</button>
        </div>
        <div class="pin-modal-body">
          <p id="pin-modal-subtitle" class="pin-subtitle">
            Masukkan PIN untuk mengedit profil ini
          </p>
          <div class="pin-input-group">
            <input
              type="password"
              id="pin-input-field"
              class="pin-input"
              placeholder="Kode PIN..."
              maxlength="10"
              autocomplete="off"
              inputmode="numeric"
            />
          </div>
          <div id="pin-error-msg" class="pin-error" style="display: none">
            ❌ Kode Akses PIN Salah!
          </div>
          <button class="pin-submit-btn" onclick="submitPin()">
            VERIFIKASI PIN 🔓
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
